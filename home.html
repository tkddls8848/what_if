<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novel IF</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf9f7;
    --fg: #1c1a17;
    --muted: #5c574f;
    --card-bg: #ffffff;
    --card-border: #ddd6cc;
    --accent: #a1462f;
    --accent-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171512;
      --fg: #ece8e1;
      --muted: #a9a297;
      --card-bg: #221f1b;
      --card-border: #3a352d;
      --accent: #e08a6e;
      --accent-fg: #1c1a17;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.7 system-ui, "Malgun Gothic", sans-serif;
  }
  main {
    max-width: 46rem;
    margin: 0 auto;
    padding: 4rem 1.5rem 3rem;
  }
  h1 {
    font-size: 1.9rem;
    margin: 0 0 0.75rem;
  }
  .lede {
    color: var(--muted);
    margin: 0 0 2.5rem;
    max-width: 34rem;
  }
  .cards {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1rem;
  }
  @media (min-width: 40rem) {
    .cards { grid-template-columns: 1fr 1fr; }
  }
  .card {
    display: block;
    border: 1px solid var(--card-border);
    border-radius: 0.75rem;
    background: var(--card-bg);
    color: inherit;
    text-decoration: none;
    padding: 1.5rem;
  }
  .card:hover { border-color: var(--accent); }
  .card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .tag {
    display: inline-block;
    font-size: 0.75rem;
    letter-spacing: 0.02em;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 0.15rem 0.6rem;
    margin-bottom: 0.75rem;
  }
  .card h2 {
    margin: 0 0 0.5rem;
    font-size: 1.15rem;
  }
  .card p {
    margin: 0;
    color: var(--muted);
    font-size: 0.92rem;
  }
  footer {
    margin-top: 3rem;
    font-size: 0.82rem;
    color: var(--muted);
  }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Novel IF</h1>
  <p class="lede">
    이 저장소는 한국어 소설 분석기에서 AI 인터랙티브 소설 앱으로 피보팅하는
    중입니다. 피보팅이 끝날 때까지는 그 바탕이 된 소설 분석기도 함께 돌아갑니다.
  </p>

  <div class="cards">
    <a class="card" href="/play">
      <span class="tag">현재 집중</span>
      <h2>인터랙티브 소설</h2>
      <p>
        캐릭터 카드와 세계관을 재료로 장면을 생성하고, 사용자가 행동을 쓰거나
        선택지를 고릅니다.
      </p>
    </a>
    <a class="card" href="/analyze">
      <span class="tag">피보팅 완료 시 제거 예정</span>
      <h2>소설 분석기</h2>
      <p>
        한국어 소설에서 인물·장소·사건·상태 변화를 추출하고, 독서 시점 기준으로
        조회하거나 what-if 분기를 만듭니다.
      </p>
    </a>
  </div>

  <footer>
    설계 문서: <a href="doc/README.md">doc/README.md</a> ·
    <a href="doc_nextsession/2026-09-05-interactive-fiction-pivot-design.md">인터랙티브 소설 피보팅 설계</a>
  </footer>
</main>
</body>
</html>
