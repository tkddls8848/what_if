<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인터랙티브 소설</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf9f6;
    --fg: #1c1c1a;
    --muted: #6b6b66;
    --border: rgba(0, 0, 0, 0.14);
    --panel: #f0efe8;
    --accent-affection: #6d5aa8;
    --accent-recovery: #3f8f6f;
    --accent-note: #a97142;
    --error: #c0392b;
    --focus: #4b5c9e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15161a;
      --fg: #e9e7e2;
      --muted: #a3a39c;
      --border: rgba(255, 255, 255, 0.16);
      --panel: #1e2024;
      --accent-affection: #b6a4e0;
      --accent-recovery: #7fcfae;
      --accent-note: #d6a06b;
      --error: #e5776b;
      --focus: #9fb0ff;
    }
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.9 system-ui, "Malgun Gothic", sans-serif; }

  /* 2단 레이아웃 — 왼쪽은 sticky 장면 패널, 오른쪽은 지금까지와 같은 읽기 칸(main). 좁은
     화면에서는 세로로 쌓되(장면 패널이 위) 패널 높이를 제한해 본문을 화면 아래로 밀어내지
     않는다. */
  .layout {
    display: grid;
    grid-template-columns: minmax(200px, 300px) minmax(0, 42rem);
    justify-content: center;
    align-items: start;
    gap: 1.5rem;
    max-width: 76rem;
    margin: 0 auto;
    padding: 1.25rem 1.25rem 6rem;
  }
  main { max-width: none; margin: 0; padding: 0; min-width: 0; }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; padding: 1rem 1rem 6rem; gap: 1rem; }
  }
  header.world { margin: 0 0 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); }
  .worldRow { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }
  .worldRow h1 { font-size: 1.15rem; margin: 0; font-weight: 600; }
  #worldNameStatic { font-size: 0.85rem; opacity: 0.6; }
  #worldPicker { font: inherit; font-size: 0.85rem; padding: 0.15rem 0.4rem; background: var(--bg); color: var(--fg); }
  .setting { margin: 0.35rem 0 0; font-size: 0.85rem; line-height: 1.55; opacity: 0.65; }
  details.cast { margin-top: 0.5rem; font-size: 0.85rem; }
  details.cast summary { cursor: pointer; opacity: 0.7; user-select: none; }
  .castList { display: grid; gap: 0.6rem; margin-top: 0.6rem; }
  .castCard { padding: 0.5rem 0.65rem; border: 1px solid var(--border); border-radius: 0.375rem; }
  .castCard strong { display: block; margin-bottom: 0.2rem; }
  .castCard p { margin: 0.1rem 0; opacity: 0.75; }

  /* 게이지: 숫자를 절대 보여주지 않는다 — 단계/문구와 채워지는 정도만 보여준다. */
  .gauges { display: grid; gap: 0.7rem; margin: 0 0 1rem; }
  .gauge { }
  .gaugeHead { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; font-size: 0.85rem; margin-bottom: 0.3rem; }
  .gaugeName { font-weight: 600; opacity: 0.85; }
  .gaugeState { opacity: 0.7; }
  .bar { height: 0.45rem; border-radius: 999px; background: var(--panel); border: 1px solid var(--border); overflow: hidden; }
  .fill { height: 100%; width: 0%; border-radius: 999px; transition: width 0.6s ease; }
  #affectionFill { background: var(--accent-affection); }
  #recoveryFill { background: var(--accent-recovery); }
  .triggerNote {
    min-height: 1.1em; margin: 0.3rem 0 0; font-size: 0.78rem; opacity: 0;
    transform: translateY(-2px); transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .triggerNote.show { opacity: 0.85; transform: translateY(0); }
  .oppositeNote {
    margin: 0.5rem 0 0; padding: 0.5rem 0.75rem; border-left: 3px solid var(--accent-note);
    background: color-mix(in srgb, var(--accent-note) 14%, transparent);
    border-radius: 0.25rem; font-size: 0.82rem; line-height: 1.6;
  }
  .notice {
    margin: 0.5rem 0 0; padding: 0.5rem 0.75rem; border-left: 3px solid var(--muted);
    background: var(--panel); border-radius: 0.25rem; font-size: 0.8rem; opacity: 0.85; line-height: 1.6;
  }

  /* 배경 장면 패널 — 왼쪽 칸에서 sticky로 항상 보인다("이미지를 채팅창에 두니까 조금만
     대화해도 보기 어렵다"는 신고에 대한 답). 이미지가 없을 때(새 세션, 장면이 안 바뀜,
     생성 실패)도 빈 구멍처럼 보이지 않도록 장소·시간·날씨 텍스트를 항상 채워 둔다. */
  .scenePanel {
    position: sticky; top: 1.25rem;
    display: block; width: 100%; aspect-ratio: 3 / 4; margin: 0;
    border-radius: 0.5rem; overflow: hidden; border: 1px solid var(--border);
    background: linear-gradient(135deg, color-mix(in srgb, currentColor 5%, transparent), color-mix(in srgb, currentColor 11%, transparent));
  }
  .scenePanel img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    opacity: 0; transition: opacity 0.9s ease; z-index: 1;
  }
  .scenePanel img.loaded { opacity: 1; }
  .scenePlaceholderText {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 1rem; font-size: 0.85rem; line-height: 1.7; opacity: 0.6;
  }
  @media (max-width: 760px) {
    .scenePanel { position: sticky; top: 0; z-index: 5; aspect-ratio: auto; height: 30vh; }
  }

  .scene { white-space: pre-wrap; margin: 0 0 2rem; }
  .scene.pending { opacity: 0.75; }
  .you { opacity: 0.6; font-style: italic; margin: 0 0 1rem; }
  .choices { display: grid; gap: 0.5rem; margin: 0 0 1.5rem; }
  .choices button { text-align: left; padding: 0.6rem 0.85rem; font: inherit; cursor: pointer;
    border: 1px solid currentColor; border-radius: 0.375rem; background: transparent; color: inherit; }
  .controls { display: flex; justify-content: flex-end; margin: 0 0 0.5rem; }
  #stopBtn { font: inherit; font-size: 0.78rem; opacity: 0.55; background: none; border: none;
    cursor: pointer; padding: 0.2rem 0.3rem; color: inherit; text-decoration: underline; }
  #stopBtn:hover { opacity: 0.85; }
  form { display: flex; gap: 0.5rem; }
  input { flex: 1; padding: 0.6rem; font: inherit; background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 0.25rem; }
  button[type=submit] { padding: 0.6rem 1rem; font: inherit; cursor: pointer; }

  /* 결말 화면 — 실패 화면이 아니라 조용한 결과 관찰이다. */
  .ending { margin: 1rem 0 2rem; padding: 1.1rem 1.25rem; border: 1px solid var(--border); border-radius: 0.5rem; background: var(--panel); }
  .ending h2 { margin: 0 0 0.5rem; font-size: 1.15rem; }
  .ending p { margin: 0 0 1.1rem; opacity: 0.85; line-height: 1.75; }
  .ending button { font: inherit; padding: 0.55rem 0.9rem; cursor: pointer; border: 1px solid currentColor; border-radius: 0.375rem; background: transparent; color: inherit; }

  .meter { position: fixed; top: 0.5rem; right: 0.75rem; font-size: 0.75rem; opacity: 0.55;
    max-width: 60vw; text-align: right; z-index: 10; }
  .cut { opacity: 0.6; font-size: 0.85em; margin: -1rem 0 1.5rem; }
  .error { color: var(--error); }
</style>
</head>
<body>
<div class="meter" id="meter" title="이 창에서 보낸 요청만 집계한 추정치입니다. Cloudflare 계정의 실제 잔여량과 다를 수 있습니다."></div>
<div class="layout">
  <aside class="scenePanel" id="scenePanel" aria-label="현재 장면">
    <p class="scenePlaceholderText" id="scenePlaceholder">장면: 아직 정해지지 않음</p>
    <img id="sceneImg" alt="" hidden>
  </aside>
  <main>
  <header class="world">
    <div class="worldRow">
      <h1 id="worldTitle">불러오는 중…</h1>
      <span id="worldNameStatic" hidden></span>
      <select id="worldPicker" hidden aria-label="세계관 선택"></select>
    </div>
    <p class="setting" id="worldSetting"></p>
    <details class="cast" id="cast">
      <summary>등장인물</summary>
      <div class="castList" id="castList"></div>
    </details>
  </header>

  <section class="gauges" aria-label="관계와 회복 상태">
    <div class="gauge">
      <div class="gaugeHead">
        <span class="gaugeName">관계</span>
        <span class="gaugeState" id="affectionState">낯선 사이</span>
      </div>
      <div class="bar" role="img" id="affectionBar" aria-label="관계 진행도: 낯선 사이">
        <div class="fill" id="affectionFill"></div>
      </div>
      <p class="triggerNote" id="affectionNote" aria-live="polite"></p>
    </div>
    <div class="gauge">
      <div class="gaugeHead">
        <span class="gaugeName">회복</span>
        <span class="gaugeState" id="recoveryState">전혀 나아지지 않았다</span>
      </div>
      <div class="bar" role="img" id="recoveryBar" aria-label="회복 진행도: 전혀 나아지지 않았다">
        <div class="fill" id="recoveryFill"></div>
      </div>
      <p class="triggerNote" id="recoveryNote" aria-live="polite"></p>
    </div>
    <p class="oppositeNote" id="oppositeNote" aria-live="polite" hidden></p>
    <p class="notice" id="judgeNotice" hidden>
      게이지가 지금 움직이지 않는 것은 로컬 판정기(Ollama)에 연결할 수 없기 때문입니다. 이야기 자체는 이 상태로도 계속됩니다.
    </p>
  </section>

  <div id="log"></div>
  <div class="choices" id="choices"></div>

  <section class="ending" id="ending" hidden>
    <h2 id="endingName"></h2>
    <p id="endingLine"></p>
    <button type="button" id="restartBtn">처음부터 다시 시작하기</button>
  </section>

  <div class="controls" id="controls">
    <button type="button" id="stopBtn">여기서 끝내기</button>
  </div>
  <form id="form">
    <input id="input" placeholder="무엇을 하시겠습니까?" autocomplete="off" required>
    <button type="submit">보내기</button>
  </form>
  </main>
</div>
<script type="module">
import { stageFor, stageLabel, recoveryLabel, endingFor } from "./src/core/sim.js";

const KEY = "novel-if-play:session";
const SCENE_KEY = "novel-if-play:scene";
const TURN_LIMIT = 30;
const ENDING_TARGET = 60;

// 결말 화면용 문구. sim.js의 endingFor가 돌려주는 reason은 개발자용 진단 문구라
// "실패 화면처럼 읽히면 안 된다"는 요구에 맞춰 플레이어에게 보여줄 문구는 따로 쓴다.
// 특히 dependence는 경고나 채점이 아니라 담담한 관찰로 읽혀야 한다.
const ENDINGS = {
  together: {
    name: "함께 선다",
    line: "당신은 기대지 않고도 곁에 남았다. 그녀도 그 옆에 그대로 있다."
  },
  standing_alone: {
    name: "혼자 설 수 있게 됐다",
    line: "그녀는 이제 당신 옆에 없을지도 모른다. 그래도 당신은 이제 두 발로 서 있다. 이것도 나쁜 결말이 아니다."
  },
  dependence: {
    name: "기대어 있다",
    line: "그녀는 여전히 곁에 있고, 당신은 아직 그녀 없이는 흔들린다. 나쁘다고 말할 수는 없다 — 다만 이것은 나아진 것이라기보다는, 기댄 것이다."
  },
  winter: {
    name: "그대로, 겨울",
    line: "아무것도 크게 바뀌지 않은 채로 계절이 지나갔다. 다음 겨울은 다를 수도 있다."
  }
};

const log = document.getElementById("log");
const choicesBox = document.getElementById("choices");
const form = document.getElementById("form");
const input = document.getElementById("input");
const meter = document.getElementById("meter");
const worldTitleEl = document.getElementById("worldTitle");
const worldSettingEl = document.getElementById("worldSetting");
const worldNameStaticEl = document.getElementById("worldNameStatic");
const worldPickerEl = document.getElementById("worldPicker");
const castListEl = document.getElementById("castList");

const affectionStateEl = document.getElementById("affectionState");
const affectionFillEl = document.getElementById("affectionFill");
const affectionBarEl = document.getElementById("affectionBar");
const affectionNoteEl = document.getElementById("affectionNote");
const recoveryStateEl = document.getElementById("recoveryState");
const recoveryFillEl = document.getElementById("recoveryFill");
const recoveryBarEl = document.getElementById("recoveryBar");
const recoveryNoteEl = document.getElementById("recoveryNote");
const oppositeNoteEl = document.getElementById("oppositeNote");
const judgeNoticeEl = document.getElementById("judgeNotice");

const scenePanelEl = document.getElementById("scenePanel");
const sceneImgEl = document.getElementById("sceneImg");
const scenePlaceholderEl = document.getElementById("scenePlaceholder");

const controlsEl = document.getElementById("controls");
const stopBtn = document.getElementById("stopBtn");
const endingEl = document.getElementById("ending");
const endingNameEl = document.getElementById("endingName");
const endingLineEl = document.getElementById("endingLine");
const restartBtn = document.getElementById("restartBtn");

let session = load();
const noteTimers = { affection: null, recovery: null };

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if (saved && saved.world_id) return saved;
  } catch (_error) { /* 저장이 깨졌으면 새로 시작한다 */ }
  return { session_id: `s-${Date.now()}`, world_id: "demo", opening: "", turns: [] };
}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(session)); } catch (_error) { /* 무시 */ }
}

/** 배경 장면 이미지 URL은 session(서버 계약)의 일부가 아니라 화면 전용 상태라
 * 별도 키에 세션 id와 묶어 저장한다 — 세션 저장 값이 매 턴 서버 응답으로 통째로
 * 교체되기 때문에 session 객체 안에 넣으면 다음 턴에 사라진다. */
function loadSceneUrl(sessionId) {
  try {
    const saved = JSON.parse(localStorage.getItem(SCENE_KEY) || "null");
    if (saved && saved.session_id === sessionId) return saved.url || null;
  } catch (_error) { /* 무시 */ }
  return null;
}

function saveSceneUrl(sessionId, url) {
  try { localStorage.setItem(SCENE_KEY, JSON.stringify({ session_id: sessionId, url })); } catch (_error) { /* 무시 */ }
}

/** 세계관 헤더와 캐스트 패널을 그린다. 목록이 아니라 상세 응답 하나로 채운다. */
function renderWorldHeader(world, cards) {
  worldTitleEl.textContent = world?.title || session.world_id;
  worldSettingEl.textContent = world?.setting || "";

  castListEl.replaceChildren();
  for (const card of cards || []) {
    const wrap = document.createElement("div");
    wrap.className = "castCard";

    const heading = document.createElement("strong");
    heading.textContent = card.aliases?.length
      ? `${card.canonical_name} (${card.aliases.join(", ")})`
      : card.canonical_name;
    wrap.append(heading);

    const lines = [];
    if (card.persona?.traits?.length) lines.push(`성격: ${card.persona.traits.join(", ")}`);
    if (card.speech?.first_person) {
      const endings = card.speech.endings?.length ? ` · 어미 ${card.speech.endings.join(", ")}` : "";
      lines.push(`말투: 1인칭 "${card.speech.first_person}"${endings}`);
    }
    for (const text of lines) {
      const p = document.createElement("p");
      p.textContent = text;
      wrap.append(p);
    }
    castListEl.append(wrap);
  }
}

async function fetchWorldDetail(worldId) {
  const response = await fetch(`/api/worlds/${encodeURIComponent(worldId)}`);
  if (!response.ok) throw new Error(`world detail fetch failed: ${response.status}`);
  return response.json();
}

async function fetchWorldsList() {
  const response = await fetch("/api/worlds");
  if (!response.ok) throw new Error(`worlds list fetch failed: ${response.status}`);
  const body = await response.json();
  return body.worlds || [];
}

/**
 * 세계관을 불러와 헤더/캐스트를 그린다. seedOpening이 참이면 세션의 opening을
 * 이 세계관의 저작된 오프닝으로 덮어쓴다 — 새 세션을 시작할 때만 쓴다. 진행 중인
 * 세션은 이미 자기 opening을 갖고 있으므로 덮어쓰지 않는다.
 *
 * card_ids도 여기서 채운다: 비어 있으면(새 세션이거나, 이 필드가 생기기 전에
 * 저장된 세션이거나) 이 세계관의 카드로 채운다. card_ids가 비어 있으면 서버의
 * 판정기가 판정할 대상이 없어 두 게이지가 영원히 0에 머무는 핵심 결함이 있었다 —
 * 여기서 항상 채워 둔다.
 */
async function loadWorldHeader(worldId, { seedOpening } = {}) {
  try {
    const detail = await fetchWorldDetail(worldId);
    renderWorldHeader(detail.world, detail.cards);
    if (seedOpening) session.opening = detail.world.opening || "";
    if (!Array.isArray(session.card_ids) || session.card_ids.length === 0) {
      session.card_ids = (detail.cards || []).map((card) => card.card_id).filter(Boolean);
    }
  } catch (_error) {
    // 세계관 API를 못 가져와도 화면은 살아 있어야 한다 — 최소한 id는 보여준다.
    worldTitleEl.textContent = session.world_id;
    worldSettingEl.textContent = "";
    castListEl.replaceChildren();
  }
}

function renderOpening() {
  // 오프닝은 이야기의 첫 장면으로 읽혀야 한다. UI 안내처럼 보이지 않도록 일반
  // 서술과 같은 클래스를 쓰고, "> 입력" 접두어도 붙이지 않는다. 턴이 하나라도
  // 있으면 그 자리는 이미 실제 서술이 대신하므로 다시 넣지 않는다.
  if (!session.opening || (session.turns || []).length > 0) return;
  const scene = document.createElement("p");
  scene.className = "scene";
  scene.textContent = session.opening;
  log.append(scene);
}

/** 등록된 캐릭터 중 최댓값을 관계 게이지에 쓴다 — endingFor가 card_id 없이 쓸 때와
 * 같은 규칙이라, 캐릭터가 하나뿐인 세계관에서도 여럿인 세계관에서도 자연스럽다. */
function primaryAffection(sim) {
  const characters = sim && sim.characters ? Object.values(sim.characters) : [];
  if (!characters.length) return 0;
  return Math.max(...characters.map((c) => Number(c.affection) || 0));
}

function updateGauges() {
  const sim = session.sim || { characters: {}, recovery: 0 };
  const affection = Math.max(0, Math.min(100, primaryAffection(sim)));
  const stage = stageFor(affection);
  const stageText = stageLabel(stage);
  affectionStateEl.textContent = stageText;
  affectionFillEl.style.width = `${affection}%`;
  affectionBarEl.setAttribute("aria-label", `관계 진행도: ${stageText}`);

  const recovery = Math.max(0, Math.min(100, Number(sim.recovery) || 0));
  const recoveryText = recoveryLabel(recovery);
  recoveryStateEl.textContent = recoveryText;
  recoveryFillEl.style.width = `${recovery}%`;
  recoveryBarEl.setAttribute("aria-label", `회복 진행도: ${recoveryText}`);
}

/** 트리거 문구를 잠깐 보여주고 스스로 사라지게 한다 — 조용한 안내이지 모달이 아니다. */
function flashNote(el, text, key) {
  if (noteTimers[key]) clearTimeout(noteTimers[key]);
  if (!text) {
    el.classList.remove("show");
    el.textContent = "";
    return;
  }
  el.textContent = text;
  el.classList.add("show");
  noteTimers[key] = setTimeout(() => el.classList.remove("show"), 6000);
}

/** 이번 턴에 실제로 맞은 트리거를 authored 문구 그대로 보여준다. 두 축이 반대로
 * 움직였으면(의존 신호) 조용히, 그러나 분명하게 알린다 — 이 시뮬레이션이 하는
 * 가장 중요한 말이기 때문에 자동으로 사라지지 않는다. */
function renderLastChange(lastChange) {
  if (!lastChange) {
    flashNote(affectionNoteEl, "", "affection");
    flashNote(recoveryNoteEl, "", "recovery");
    oppositeNoteEl.hidden = true;
    return;
  }
  const matched = lastChange.matched || { attraction: [], dislike: [], relief: [], strain: [] };
  const affectionLines = [
    ...(matched.attraction || []).map((t) => `+ ${t}`),
    ...(matched.dislike || []).map((t) => `− ${t}`)
  ];
  const recoveryLines = [
    ...(matched.relief || []).map((t) => `+ ${t}`),
    ...(matched.strain || []).map((t) => `− ${t}`)
  ];
  flashNote(affectionNoteEl, affectionLines.join("  ·  "), "affection");
  flashNote(recoveryNoteEl, recoveryLines.join("  ·  "), "recovery");

  const affDelta = Number(lastChange.affection_delta) || 0;
  const recDelta = Number(lastChange.recovery_delta) || 0;
  const opposite = (affDelta > 0 && recDelta < 0) || (affDelta < 0 && recDelta > 0);
  if (opposite) {
    oppositeNoteEl.textContent = affDelta > 0
      ? "관계는 가까워졌지만 회복은 오히려 멀어졌다 — 기대는 것과 나아지는 것은 다른 일이다."
      : "관계는 멀어졌지만 회복은 오히려 나아졌다 — 밀어내는 것이 늘 나쁜 것은 아니다.";
    oppositeNoteEl.hidden = false;
  } else {
    oppositeNoteEl.hidden = true;
  }
}

function showJudgeNotice(unavailable) {
  judgeNoticeEl.hidden = !unavailable;
}

function setSceneImage(url) {
  if (!url) return;
  sceneImgEl.onload = () => sceneImgEl.classList.add("loaded");
  sceneImgEl.onerror = () => {
    sceneImgEl.hidden = true;
    sceneImgEl.classList.remove("loaded");
  };
  sceneImgEl.hidden = false;
  sceneImgEl.classList.remove("loaded");
  sceneImgEl.src = url;
  saveSceneUrl(session.session_id, url);
}

function restoreSceneImage() {
  const url = loadSceneUrl(session.session_id);
  if (url) {
    setSceneImage(url);
  } else {
    sceneImgEl.hidden = true;
    sceneImgEl.classList.remove("loaded");
    sceneImgEl.removeAttribute("src");
  }
}

/** 이미지가 없을 때(새 세션, 장면이 안 바뀜, 생성 실패) 패널이 빈 구멍처럼 보이지
 * 않도록 장소·시간·날씨를 텍스트로 채운다. 이미지가 도착해 덮으면 안 보이지만,
 * 이미지가 실패하거나 아직 없으면 계속 이 텍스트가 패널의 유일한 내용이 된다. */
function sceneDescriptor(scene) {
  if (!scene || (!scene.place && !scene.time && !scene.weather)) return "장면: 아직 정해지지 않음";
  return [scene.place, scene.time, scene.weather].filter(Boolean).join(" · ");
}

function updateScenePlaceholder() {
  scenePlaceholderEl.textContent = sceneDescriptor(session.current_scene);
}

function render() {
  log.replaceChildren();
  renderOpening();
  for (const turn of session.turns || []) {
    // 스트림이 글자 하나 오기 전에 끊긴 턴은 narration이 빈 문자열로 저장된다.
    // 그대로 그리면 새로고침할 때마다 사용자 입력 뒤에 영원히 빈 장면이 보인다.
    if (!turn.narration) continue;
    const you = document.createElement("p");
    you.className = "you";
    you.textContent = `> ${turn.user_input}`;
    log.append(you);
    const scene = document.createElement("p");
    scene.className = "scene";
    scene.textContent = turn.narration;
    log.append(scene);
  }
  const last = (session.turns || [])[session.turns.length - 1];
  renderChoices(last ? last.choices : []);
  updateGauges();
  restoreSceneImage();
  updateScenePlaceholder();
  renderLastChange(null);
  showJudgeNotice(false);

  if ((session.turn_count || 0) >= TURN_LIMIT) {
    showEnding();
  } else {
    hideEnding();
  }
}

function renderChoices(choices) {
  choicesBox.replaceChildren();
  for (const choice of choices || []) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = choice;
    button.addEventListener("click", () => send(choice));
    choicesBox.append(button);
  }
}

function computeEnding() {
  return endingFor(session.sim, { affectionTarget: ENDING_TARGET, recoveryTarget: ENDING_TARGET });
}

function showEnding() {
  const result = computeEnding();
  const meta = ENDINGS[result.ending] || ENDINGS.winter;
  endingNameEl.textContent = meta.name;
  endingLineEl.textContent = meta.line;
  endingEl.hidden = false;
  choicesBox.hidden = true;
  controlsEl.hidden = true;
  form.hidden = true;
}

function hideEnding() {
  endingEl.hidden = true;
  choicesBox.hidden = false;
  controlsEl.hidden = false;
  form.hidden = false;
}

async function refreshMeter() {
  try {
    const health = await fetch("/api/cf/health").then((r) => r.json());
    meter.textContent = health.configured
      ? `이 세션 추정 Neurons ${Math.round(health.budget.remaining).toLocaleString()} / ${health.budget.free_per_day.toLocaleString()}`
      : "CF 자격 증명 미설정 — .env.example을 .env로 복사하세요";
  } catch (_error) {
    meter.textContent = "";
  }
}

/** 다른 세계관으로 완전히 새 세션을 시작한다. 진행 중이던 턴은 버려진다. */
async function startNewSession(worldId) {
  session = { session_id: `s-${Date.now()}`, world_id: worldId, opening: "", turns: [] };
  await loadWorldHeader(worldId, { seedOpening: true });
  save();
  render();
  refreshMeter();
}

worldPickerEl.addEventListener("change", async () => {
  const nextId = worldPickerEl.value;
  if (!nextId || nextId === session.world_id) return;

  if ((session.turns || []).length > 0) {
    const proceed = confirm("진행 중인 이야기가 있습니다. 다른 세계관을 선택하면 지금 이야기는 사라집니다. 계속할까요?");
    if (!proceed) {
      worldPickerEl.value = session.world_id;
      return;
    }
  }
  await startNewSession(nextId);
});

stopBtn.addEventListener("click", () => {
  if (!confirm("지금까지의 이야기를 여기서 끝내시겠습니까?")) return;
  showEnding();
});

restartBtn.addEventListener("click", async () => {
  await startNewSession(session.world_id);
});

async function send(userInput) {
  form.querySelector("button").disabled = true;
  renderChoices([]);

  const you = document.createElement("p");
  you.className = "you";
  you.textContent = `> ${userInput}`;
  log.append(you);

  const scene = document.createElement("p");
  scene.className = "scene pending";
  log.append(scene);
  scene.scrollIntoView({ block: "end" });

  try {
    const response = await fetch("/api/turn", {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "text/event-stream" },
      body: JSON.stringify({ session, user_input: userInput })
    });

    if (!response.ok) {
      // 스트림이 시작되기 전에 실패하면 본문은 SSE가 아니라 JSON 한 덩어리다.
      // 그대로 SSE 파서에 넣으면 프레임 경계가 없어 조용히 삼켜진다.
      const body = await response.json().catch(() => null);
      scene.className = "scene error";
      scene.textContent = body?.message || "요청이 실패했습니다.";
      return;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let cut;
      while ((cut = buffer.indexOf("\n\n")) !== -1) {
        const block = buffer.slice(0, cut);
        buffer = buffer.slice(cut + 2);
        const event = /^event: (.+)$/m.exec(block)?.[1];
        const data = /^data: (.+)$/m.exec(block)?.[1];
        if (!event || !data) continue;
        const payload = JSON.parse(data);
        if (event === "narration") {
          scene.textContent += payload.delta;
          scene.scrollIntoView({ block: "end" });
        } else if (event === "scene") {
          // 배경 이미지는 서술이 다 흐른 몇 초 뒤에 온다 — 도착하면 그때 끼워
          // 넣을 뿐, 텍스트를 기다리게 하지 않는다.
          setSceneImage(payload.url);
        } else if (event === "done") {
          scene.className = "scene";
          scene.textContent = payload.turn.narration;
          session = payload.session;
          save();
          renderChoices(payload.turn.choices);
          updateGauges();
          updateScenePlaceholder();
          renderLastChange(payload.last_change);
          showJudgeNotice(Boolean(payload.judge_unavailable));
          if (payload.truncated) {
            // 스트림이 도중에 끊긴 장면이다. 독자가 모르면 작가가 문장을 끊은 것으로 읽는다.
            const cutEl = document.createElement("p");
            cutEl.className = "cut";
            cutEl.textContent = "장면이 도중에 끊겼습니다. 이어서 입력하면 계속됩니다.";
            log.append(cutEl);
          }
          // budget_unknown이면 단가를 몰라 계량하지 못한 모델이었다는 뜻이다.
          // 숫자를 그대로 두면 실제로는 과금됐는데 화면은 그대로인 것처럼 보인다.
          meter.textContent = payload.budget_unknown
            ? "이 세션 추정 Neurons ?"
            : `이 세션 추정 Neurons ${Math.round(payload.budget.remaining).toLocaleString()}`;

          if ((session.turn_count || 0) >= TURN_LIMIT) {
            showEnding();
          }
        } else if (event === "error") {
          scene.className = "scene error";
          scene.textContent = payload.message;
        }
      }
    }
  } catch (error) {
    scene.className = "scene error";
    scene.textContent = "요청이 실패했습니다.";
  } finally {
    form.querySelector("button").disabled = false;
    input.value = "";
    input.focus();
  }
}

form.addEventListener("submit", (event) => {
  event.preventDefault();
  const value = input.value.trim();
  if (value) send(value);
});

async function init() {
  // 헤더부터 그린다 — 목록 API가 실패해도 최소한 지금 세계관은 보이게 한다.
  // 진행 중인 세션(턴이 이미 있는)의 opening은 덮어쓰지 않는다.
  await loadWorldHeader(session.world_id, { seedOpening: (session.turns || []).length === 0 });
  save();
  render();

  try {
    const worlds = await fetchWorldsList();
    if (worlds.length > 1) {
      worldPickerEl.replaceChildren();
      for (const world of worlds) {
        const option = document.createElement("option");
        option.value = world.world_id;
        option.textContent = world.title || world.world_id;
        worldPickerEl.append(option);
      }
      worldPickerEl.value = session.world_id;
      worldPickerEl.hidden = false;
    } else if (worlds.length === 1) {
      // 세계관이 하나뿐이면 고를 게 없다 — 옵션 하나짜리 드롭다운 대신 이름만 보여준다.
      worldNameStaticEl.textContent = worlds[0].title || worlds[0].world_id;
      worldNameStaticEl.hidden = false;
    }
  } catch (_error) {
    /* 목록을 못 가져와도 위에서 이미 헤더는 그려졌다 */
  }
}

init();
refreshMeter();
</script>
</body>
</html>
